<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | Sports Store</title>
  <meta name="description" content="The page you requested could not be found. Return to Sports Store homepage or explore our athletic gear catalog.">

  <!-- Favicon Logo -->
  <link rel="icon" type="image/webp" href="assets/images/logoStackly.webp">

  <!-- CDNs -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #121212; padding: 20px;">

  <!-- PRELOADER OVERLAY -->
  <div id="preloader-overlay" class="preloader-overlay">
    <div class="preloader-wrapper">
      <div class="preloader-graphics-stage">
        <svg class="preloader-svg-graphic" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="44" fill="none" stroke="#2b2b2b" stroke-width="4"></circle>
          <circle cx="50" cy="50" r="44" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="70 180" stroke-linecap="round"></circle>
        </svg>
        <img src="assets/images/logoStackly.webp" alt="Logo" class="preloader-icon" style="height: 38px; width: auto; object-fit: contain;">
      </div>
      <div class="preloader-status-text">INITIALIZING SPORTS STORE...</div>
      <div class="preloader-bar-bg">
        <div id="preloader-bar-fill" class="preloader-bar-fill"></div>
      </div>
      <div id="preloader-percent-label" class="preloader-percent-label">0%</div>
    </div>
  </div>

  <!-- STANDALONE 404 CONTENT CONTAINER -->
  <div class="text-center rounded-4 mx-auto" style="background: #1e1e1e; border: 1.5px solid #333333; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85); max-width: 580px; width: 100%; padding: clamp(1.8rem, 4vw, 3rem);">
    <a href="index.html" class="d-inline-block mb-3">
      <img src="assets/images/logoStackly.webp" alt="Sports Store Logo" style="height: 46px; width: auto;">
    </a>

    <div class="mb-2">
      <span class="fw-bold text-light" style="font-size: clamp(4.5rem, 12vw, 6.5rem); letter-spacing: -2px; font-family: var(--font-heading); line-height: 1; display: inline-block;">404</span>
    </div>

    <div class="section-tag mb-3 mx-auto" style="background: #282828; border-color: #555555; padding: 4px 14px; font-size: 0.8rem;"><span class="dot pulse-dot-anim"></span> Error 404 - Out of Bounds</div>
    <h1 class="h3 fw-bold text-light mb-2" style="font-family: var(--font-heading); letter-spacing: 0.5px;">PAGE NOT FOUND</h1>
    <p class="text-muted small mb-4 mx-auto" style="max-width: 440px; color: #d4d4d4 !important; line-height: 1.5;">
      The requested gear item, specification, or training guide page was not found or is currently undergoing championship recalibration.
    </p>

    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <button onclick="history.back()" class="btn-apex btn-apex-outline py-2 px-3 style-btn" style="font-size: 0.9rem;">
        <i class="fa-solid fa-arrow-left me-1"></i> Go Back
      </button>
      <a href="index.html" class="btn-apex btn-apex-primary py-2 px-3 style-btn" style="font-size: 0.9rem;">
        <i class="fa-solid fa-house me-1"></i> Back to Home
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
